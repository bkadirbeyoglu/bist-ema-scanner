# ============================================================
# BASE CONFIGURATION
# Use: docker-compose -f docker-compose.yml -f docker-compose.{env}.yml up
# ============================================================

services:
  # ============================================================
  # Trading Application
  # ============================================================
  trading-app:
    build:
      context: .
      dockerfile: Dockerfile
    
    # No container_name in base (allows scaling)
    
    environment:
      - TRADING_ENV=${TRADING_ENV:-development}
      - DATABASE_URL=postgresql://${DB_USER:-trading}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-trading_db}
      - REDIS_URL=redis://redis:6379
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_started
    
    networks:
      - trading-network

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:15-alpine
    
    environment:
      - POSTGRES_DB=trading_db          # ← Hardcode this for now
      - POSTGRES_USER=trading            # ← Hardcode this
      - POSTGRES_PASSWORD=password       # ← Hardcode this
    
    volumes:
      # - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - trading-network

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    networks:
      - trading-network

  # ============================================================
  # LocalStack
  # ============================================================
  localstack:
    image: localstack/localstack:latest
    
    environment:
      - SERVICES=sqs,s3,dynamodb
      - DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock

    ports:
      - "4566:4566"              # ← ADD THIS LINE!
      - "4510-4559:4510-4559"    # ← ADD THIS LINE!

    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
    driver: local
  localstack-data:
    driver: local