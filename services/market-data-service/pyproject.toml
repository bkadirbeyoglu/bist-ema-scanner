[tool.poetry]
name = "market-data-service"
version = "1.0.0"
description = "Market Data Microservice - Real-time price feeds"
authors = ["Trading Platform Team"]
readme = "README.md"
packages = [{include = "market_data_service", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
websockets = "^12.0"

# AWS Integration
aioboto3 = "^12.0.0"
boto3 = "^1.34.0"

# HTTP Client (for Alpha Vantage, etc.)
aiohttp = "^3.9.0"

# Validation & Serialization
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Utilities
python-dotenv = "^1.0.0"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"