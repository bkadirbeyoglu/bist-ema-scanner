# k8s/order-service/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: trading-system
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: algo-trading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: order-service
        version: v1
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: SERVICE_NAME
              value: "order-service"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: LOG_LEVEL
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: AWS_ENDPOINT_URL
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: DB_PASSWORD
            # Service Discovery via K8s DNS!
            - name: MARKET_DATA_SERVICE_URL
              value: "http://market-data-service:8001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
