# k8s/notification-service/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: trading-system
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: algo-trading
spec:
  replicas: 1  # Single replica sufficient for notifications
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: SERVICE_NAME
              value: "notification-service"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: LOG_LEVEL
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: AWS_ENDPOINT_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
